services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quevo
      POSTGRES_USER: quevo
      POSTGRES_PASSWORD: quevo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quevo -d quevo"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - quevo

  api:
    build:
      context: ./apps/api
      target: development
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://quevo:quevo@db:5432/quevo?sslmode=disable
    ports:
      - "8080:8080"
    volumes:
      - ./apps/api:/app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    networks:
      - quevo

  web:
    build:
      context: ./apps/web
      target: development
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    networks:
      - quevo

volumes:
  postgres-data:
  web-node-modules:

networks:
  quevo:
    driver: bridge
